name: CMake

on:
  push:
    branches:
      - devel
      - master
  pull_request:
    branches:
      - devel
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        build_type: ["Release", "Debug"]
        with_vdb: ["ON", "OFF"]
        with_eigen: ["ON", "OFF"]
        with_tbb: ["ON", "OFF"]
        with_chaiscript: ["OFF"]
        use_single_precision: ["OFF"]
        container: [""]

        include:
          - container: ""
            build_type: "Debug"
            with_vdb: "ON"
            with_eigen: "ON"
            with_tbb: "ON"
            with_chaiscript: "OFF"
            use_single_precision: "ON"

          - container: aswf/ci-vfxall:2021
            build_type: "Release"
            with_vdb: "ON"
            with_eigen: "ON"
            with_tbb: "ON"
            with_chaiscript: "OFF"
            use_single_precision: "OFF"

          - container: aswf/ci-vfxall:2022
            build_type: "Release"
            with_vdb: "ON"
            with_eigen: "ON"
            with_tbb: "ON"
            with_chaiscript: "OFF"
            use_single_precision: "OFF"

    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        env:
          WITH_EIGEN: ${{ matrix.with_eigen }}
          WITH_TBB: ${{ matrix.with_tbb }}
          WITH_VDB: ${{ matrix.with_vdb }}
          CI_CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=()
          else
            SUDO=(sudo)
          fi

          if command -v apt-get >/dev/null 2>&1; then
            "${SUDO[@]}" apt-get update -qy

            if apt-cache show libwxgtk3.2-dev >/dev/null 2>&1; then
              WX_PACKAGE=libwxgtk3.2-dev
            elif apt-cache show libwxgtk3.0-gtk3-dev >/dev/null 2>&1; then
              WX_PACKAGE=libwxgtk3.0-gtk3-dev
            else
              echo "No supported wxWidgets development package found"
              exit 1
            fi

            PACKAGES=(
              "$WX_PACKAGE"
              libhdf5-dev
            )

            if [ "$WITH_EIGEN" = "ON" ]; then
              PACKAGES+=(libeigen3-dev)
            fi

            if [ -z "$CI_CONTAINER" ]; then
              if [ "$WITH_TBB" = "ON" ]; then
                PACKAGES+=(libtbb-dev)
              fi

              if [ "$WITH_VDB" = "ON" ]; then
                PACKAGES+=(
                  libopenvdb-dev
                  libboost-iostreams-dev
                  libboost-system-dev
                )
              fi
            fi

            "${SUDO[@]}" apt-get install -y \
              --no-install-recommends "${PACKAGES[@]}"

          elif command -v dnf >/dev/null 2>&1; then
            PACKAGES=(wxGTK3-devel)

            if [ "$WITH_EIGEN" = "ON" ]; then
              PACKAGES+=(eigen3-devel)
            fi

            "${SUDO[@]}" dnf install -y "${PACKAGES[@]}"

          elif command -v yum >/dev/null 2>&1; then
            PACKAGES=(wxGTK3-devel)

            if [ "$WITH_EIGEN" = "ON" ]; then
              PACKAGES+=(eigen3-devel)
            fi

            "${SUDO[@]}" yum install -y \
              --setopt=tsflags=nodocs \
              "${PACKAGES[@]}"

          else
            echo "Unsupported package manager"
            exit 1
          fi

      - name: Configure CMake
        shell: bash
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          WITH_VDB: ${{ matrix.with_vdb }}
          WITH_EIGEN: ${{ matrix.with_eigen }}
          WITH_TBB: ${{ matrix.with_tbb }}
          WITH_CHAISCRIPT: ${{ matrix.with_chaiscript }}
          SINGLE_PRECISION: ${{ matrix.use_single_precision }}
          CI_CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail

          if [ -z "$CI_CONTAINER" ]; then
            HDF5=ON
          else
            HDF5=OFF
          fi

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DUSE_SINGLE_PRECISION="$SINGLE_PRECISION" \
            -DWITH_EIGEN="$WITH_EIGEN" \
            -DWITH_CHAISCRIPT="$WITH_CHAISCRIPT" \
            -DWITH_VDB="$WITH_VDB" \
            -DWITH_TBB="$WITH_TBB" \
            -DWITH_HDF5="$HDF5" \
            -DBUILD_UTILS=ON

      - name: Build
        shell: bash
        run: |
          cmake --build build \
            --config "${{ matrix.build_type }}" \
            --parallel 4
